<section class="box-touch-chart" aria-label="가격 및 거래량 차트">
  <h3 class="box-chart-title"></h3>
  <div class="box-chart-legend" aria-label="이동평균선 범례"></div>
  <div class="box-chart-toolbar" role="group" aria-label="차트 조작">
    <button type="button" data-action="in">확대 +</button>
    <button type="button" data-action="out">축소 −</button>
    <button type="button" data-action="reset">차트 초기화</button>
  </div>
  <p class="box-chart-help">한 손가락: 페이지 스크롤 · 두 손가락: 차트 이동·확대<br>PC: 드래그로 이동 · 확대·축소는 위 버튼 사용</p>
  <div class="box-chart-plot"></div>
  <p class="box-chart-status" role="status" aria-live="polite"></p>
</section>
